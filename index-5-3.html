<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clínica de Depilação — Marcar Horário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { font-family: 'Work Sans', sans-serif; }
  .font-display { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; letter-spacing: 0.01em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-pink-50 text-stone-900">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const PROFISSIONAL_PIN = "8862";
const WHATSAPP_STORAGE_KEY = "config:whatsapp";
const SERVICES_STORAGE_KEY = "config:services";

const DEFAULT_SERVICES = [
  { id: "axilas", label: "Axilas", desc: "Depilação das axilas", minutes: 20, price: 0 },
  { id: "meia-perna", label: "Meia perna", desc: "Da panturrilha ao joelho", minutes: 30, price: 0 },
  { id: "perna-inteira", label: "Perna inteira", desc: "Perna completa", minutes: 45, price: 0 },
  { id: "buco", label: "Buço", desc: "Depilação do buço", minutes: 10, price: 0 },
  { id: "virilha", label: "Virilha", desc: "Virilha simples ou completa", minutes: 25, price: 0 },
];

function slugify(text) {
  return (text || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

function todayISO() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

function formatDateLabel(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return date.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
}

function formatPrice(value) {
  const num = Number(value) || 0;
  return num.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function servicesLabel(ids, list) {
  const source = list || DEFAULT_SERVICES;
  const names = (ids || []).map((id) => source.find((s) => s.id === id)?.label).filter(Boolean);
  return names.join(" + ");
}

/* ---- inline icons (no external icon dependency, GitHub-Pages friendly) ---- */
const Icon = ({ children, size = 20, className = "" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
    strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
);
const FlowerIcon = (p) => <Icon {...p}><circle cx="12" cy="12" r="3"/><path d="M12 2a3 3 0 0 1 3 3 3 3 0 0 1-3 3 3 3 0 0 1-3-3 3 3 0 0 1 3-3z"/><path d="M12 16a3 3 0 0 1 3 3 3 3 0 0 1-3 3 3 3 0 0 1-3-3 3 3 0 0 1 3-3z"/><path d="M22 12a3 3 0 0 1-3 3 3 3 0 0 1-3-3 3 3 0 0 1 3-3 3 3 0 0 1 3 3z"/><path d="M8 12a3 3 0 0 1-3 3 3 3 0 0 1-3-3 3 3 0 0 1 3-3 3 3 0 0 1 3 3z"/></Icon>;
const LockIcon = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;
const UserIcon = (p) => <Icon {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Icon>;
const CalendarIcon = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></Icon>;
const CheckIcon = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;
const TrashIcon = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></Icon>;
const ChevronLeftIcon = (p) => <Icon {...p}><polyline points="15 18 9 12 15 6"/></Icon>;
const AlertIcon = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>;
const WhatsIcon = (p) => (
  <svg width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="currentColor" className={p.className||""}>
    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
    <path d="M12.001 2C6.478 2 2 6.477 2 12c0 1.837.494 3.616 1.432 5.184L2 22l4.943-1.396A9.955 9.955 0 0 0 12.001 22C17.523 22 22 17.523 22 12S17.523 2 12.001 2zm0 18.18a8.15 8.15 0 0 1-4.166-1.14l-.299-.177-2.936.828.834-2.86-.194-.294A8.14 8.14 0 0 1 3.82 12c0-4.514 3.667-8.18 8.181-8.18 4.513 0 8.18 3.666 8.18 8.18 0 4.514-3.667 8.18-8.18 8.18z"/>
  </svg>
);

function DecorStripe({ className = "" }) {
  return (
    <div className={"h-1.5 w-full " + className} style={{
      backgroundImage: "linear-gradient(90deg, #F9D6E6 0%, #E0699C 35%, #C6A6EA 70%, #F9D6E6 100%)"
    }} />
  );
}

function onlyDigits(str) {
  return (str || "").replace(/\D/g, "");
}

function BarbeariaApp() {
  const [role, setRole] = useState(null);
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState("");

  const [date, setDate] = useState(todayISO());
  const [slots, setSlots] = useState([]);
  const [loading, setLoading] = useState(false);
  const [storageError, setStorageError] = useState("");

  const [selectedServices, setSelectedServices] = useState([]);
  const [selectedSlotId, setSelectedSlotId] = useState(null);
  const [clientName, setClientName] = useState("");
  const [ticket, setTicket] = useState(null);

  const [newTime, setNewTime] = useState("");

  const [adminWhats, setAdminWhats] = useState("");
  const [whatsInput, setWhatsInput] = useState("");
  const [whatsSaved, setWhatsSaved] = useState(false);

  const [services, setServices] = useState(DEFAULT_SERVICES);
  const [svcLabel, setSvcLabel] = useState("");
  const [svcDesc, setSvcDesc] = useState("");
  const [svcMinutes, setSvcMinutes] = useState("");
  const [svcPrice, setSvcPrice] = useState("");
  const [editingSvcId, setEditingSvcId] = useState(null);
  const [svcError, setSvcError] = useState("");

  useEffect(() => {
    try {
      const saved = localStorage.getItem(WHATSAPP_STORAGE_KEY) || "";
      setAdminWhats(saved);
      setWhatsInput(saved);
    } catch (e) {}
    try {
      const savedServices = localStorage.getItem(SERVICES_STORAGE_KEY);
      if (savedServices) {
        const parsed = JSON.parse(savedServices);
        if (Array.isArray(parsed) && parsed.length > 0) setServices(parsed);
      }
    } catch (e) {}
  }, []);

  function persistServices(next) {
    setServices(next);
    try {
      localStorage.setItem(SERVICES_STORAGE_KEY, JSON.stringify(next));
    } catch (e) {
      setSvcError("Não foi possível salvar os serviços neste navegador.");
    }
  }

  function resetServiceForm() {
    setEditingSvcId(null);
    setSvcLabel("");
    setSvcDesc("");
    setSvcMinutes("");
    setSvcPrice("");
    setSvcError("");
  }

  function handleEditService(sv) {
    setEditingSvcId(sv.id);
    setSvcLabel(sv.label);
    setSvcDesc(sv.desc);
    setSvcMinutes(String(sv.minutes));
    setSvcPrice(sv.price ? String(sv.price) : "");
    setSvcError("");
  }

  function handleSaveService() {
    const label = svcLabel.trim();
    const minutesNum = parseInt(svcMinutes, 10);
    const priceNum = svcPrice === "" ? 0 : parseFloat(svcPrice.replace(",", "."));
    if (!label) {
      setSvcError("Digite um nome para o serviço.");
      return;
    }
    if (!minutesNum || minutesNum <= 0) {
      setSvcError("Informe uma duração válida (em minutos).");
      return;
    }
    if (isNaN(priceNum) || priceNum < 0) {
      setSvcError("Informe um preço válido.");
      return;
    }
    if (editingSvcId) {
      const next = services.map((s) => s.id === editingSvcId ? { ...s, label, desc: svcDesc.trim(), minutes: minutesNum, price: priceNum } : s);
      persistServices(next);
    } else {
      let id = slugify(label) || "servico";
      if (services.some((s) => s.id === id)) id = id + "-" + Date.now().toString(36);
      const next = [...services, { id, label, desc: svcDesc.trim(), minutes: minutesNum, price: priceNum }];
      persistServices(next);
    }
    resetServiceForm();
  }

  function handleDeleteService(id) {
    persistServices(services.filter((s) => s.id !== id));
    setSelectedServices((prev) => prev.filter((x) => x !== id));
    if (editingSvcId === id) resetServiceForm();
  }

  function saveWhatsNumber() {
    const digits = onlyDigits(whatsInput);
    if (!digits) {
      setStorageError("Digite um número de WhatsApp válido (com DDI e DDD).");
      return;
    }
    try {
      localStorage.setItem(WHATSAPP_STORAGE_KEY, digits);
      setAdminWhats(digits);
      setWhatsInput(digits);
      setStorageError("");
      setWhatsSaved(true);
      setTimeout(() => setWhatsSaved(false), 2500);
    } catch (e) {
      setStorageError("Não foi possível salvar o número neste navegador.");
    }
  }


  const dayKey = "day:" + date;

  const loadSlots = useCallback(() => {
    setLoading(true);
    setStorageError("");
    try {
      const raw = localStorage.getItem(dayKey);
      const parsed = raw ? JSON.parse(raw) : [];
      parsed.sort((a, b) => a.time.localeCompare(b.time));
      setSlots(parsed);
    } catch (e) {
      setSlots([]);
    } finally {
      setLoading(false);
    }
  }, [dayKey]);

  useEffect(() => {
    loadSlots();
    setSelectedSlotId(null);
    setSelectedServices([]);
    setTicket(null);
  }, [loadSlots]);

  function persist(nextSlots) {
    const sorted = [...nextSlots].sort((a, b) => a.time.localeCompare(b.time));
    setSlots(sorted);
    try {
      localStorage.setItem(dayKey, JSON.stringify(sorted));
    } catch (e) {
      setStorageError("Não foi possível salvar neste navegador.");
    }
  }

  function handleAddSlot() {
    if (!newTime) return;
    if (slots.some((s) => s.time === newTime)) {
      setStorageError("Já existe um horário cadastrado nesse ponto.");
      return;
    }
    const next = [...slots, { id: date + "-" + newTime + "-" + Date.now(), time: newTime, status: "free", clientName: "", services: [] }];
    persist(next);
    setNewTime("");
  }

  function handleRemoveSlot(id) {
    persist(slots.filter((s) => s.id !== id));
  }

  function toggleService(id) {
    setSelectedServices((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);
  }

  function handleBook() {
    if (selectedServices.length === 0 || !selectedSlotId || !clientName.trim()) return;
    const next = slots.map((s) => s.id === selectedSlotId ? { ...s, status: "booked", clientName: clientName.trim(), services: selectedServices } : s);
    persist(next);
    const bookedSlot = next.find((s) => s.id === selectedSlotId);
    const ticketData = { ...bookedSlot, date };
    setTicket(ticketData);
    setSelectedSlotId(null);
    setSelectedServices([]);
    setClientName("");

    const msg = "Novo agendamento:\nCliente: " + ticketData.clientName +
      "\nData: " + formatDateLabel(ticketData.date) +
      "\nHorário: " + ticketData.time +
      "\nServiços: " + servicesLabel(ticketData.services, services) +
      "\nValor: " + formatPrice(ticketData.services.reduce((sum, id) => sum + (services.find((s) => s.id === id)?.price || 0), 0));
    if (adminWhats) {
      const waUrl = "https://wa.me/" + adminWhats + "?text=" + encodeURIComponent(msg);
      window.open(waUrl, "_blank");
    }
  }

  function checkPin() {
    if (pinInput === PROFISSIONAL_PIN) {
      setAdminUnlocked(true);
      setPinError("");
    } else {
      setPinError("PIN incorreto. Tente novamente.");
    }
  }

  const freeSlots = slots.filter((s) => s.status === "free");
  const totalMinutes = selectedServices.reduce((sum, id) => sum + (services.find((s) => s.id === id)?.minutes || 0), 0);
  const totalPrice = selectedServices.reduce((sum, id) => sum + (services.find((s) => s.id === id)?.price || 0), 0);

  return (
    <div className="min-h-screen w-full bg-pink-50 text-stone-900 flex flex-col items-center">
      <header className="w-full max-w-3xl px-6 pt-10 pb-6 text-center">
        <div className="flex items-center justify-center gap-3 mb-1">
          <FlowerIcon className="text-pink-500" size={28} />
          <h1 className="text-4xl sm:text-5xl tracking-wide text-stone-900 font-display">Clínica Depilação</h1>
        </div>
        <p className="text-stone-500 text-sm italic">
          Marcações do dia — sem fila, sem espera
        </p>
      </header>

      <DecorStripe className="max-w-3xl rounded-full mx-6" />

      {!role && (
        <main className="w-full max-w-3xl px-6 py-14 flex flex-col items-center gap-6">
          <p className="text-stone-500 text-center max-w-md">
            Escolha como deseja entrar. Clientes marcam horário; a profissional organiza a agenda do dia.
          </p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 w-full max-w-md">
            <button onClick={() => setRole("cliente")} className="border border-pink-200 hover:border-pink-500 bg-white rounded-2xl px-6 py-8 flex flex-col items-center gap-3 shadow-sm hover:shadow-md transition-all">
              <UserIcon className="text-pink-500" size={30} />
              <span className="text-xl font-display">Cliente</span>
              <span className="text-stone-500 text-sm text-center">Marcar meu horário</span>
            </button>
            <button onClick={() => setRole("admin")} className="border border-pink-200 hover:border-pink-500 bg-white rounded-2xl px-6 py-8 flex flex-col items-center gap-3 shadow-sm hover:shadow-md transition-all">
              <LockIcon className="text-pink-500" size={30} />
              <span className="text-xl font-display">Profissional</span>
              <span className="text-stone-500 text-sm text-center">Gerenciar a agenda</span>
            </button>
          </div>
        </main>
      )}

      {role && (
        <div className="w-full max-w-3xl px-6 pt-6">
          <button onClick={() => { setRole(null); setAdminUnlocked(false); setPinInput(""); setPinError(""); setTicket(null); }}
            className="flex items-center gap-1 text-stone-500 hover:text-pink-500 text-sm transition-colors">
            <ChevronLeftIcon size={16} /> Voltar
          </button>
        </div>
      )}

      {role === "admin" && !adminUnlocked && (
        <main className="w-full max-w-sm px-6 py-14 flex flex-col items-center gap-4">
          <LockIcon className="text-pink-500" size={26} />
          <p className="text-stone-500 text-sm text-center">Digite o PIN da profissional para continuar.</p>
          <input type="password" value={pinInput} onChange={(e) => setPinInput(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && checkPin()}
            className="w-full text-center tracking-[0.5em] bg-white border border-pink-200 rounded-xl px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-pink-500"
            placeholder="••••" maxLength={4} />
          {pinError && <p className="text-red-400 text-sm flex items-center gap-1"><AlertIcon size={14}/>{pinError}</p>}
          <button onClick={checkPin} className="w-full bg-pink-500 hover:bg-pink-400 text-white font-semibold rounded-full py-2.5 transition-colors">Entrar</button>
        </main>
      )}

      {role && (adminUnlocked || role === "cliente") && (
        <main className="w-full max-w-3xl px-6 pb-16">
          <div className="flex items-center gap-3 mt-4 mb-6 bg-white border border-pink-100 rounded-2xl px-4 py-3 shadow-sm">
            <CalendarIcon className="text-pink-500 shrink-0" size={20} />
            <input type="date" value={date} min={role === "cliente" ? todayISO() : undefined}
              onChange={(e) => setDate(e.target.value)}
              className="bg-transparent text-stone-900 focus:outline-none flex-1" style={{ colorScheme: "light" }} />
            <span className="text-stone-500 text-sm capitalize hidden sm:block">{formatDateLabel(date)}</span>
          </div>

          {storageError && <p className="text-red-400 text-sm mb-4 flex items-center gap-1"><AlertIcon size={14}/>{storageError}</p>}

          {role === "admin" && (
            <section className="mb-8 bg-white border border-pink-100 rounded-2xl p-5 shadow-sm">
              <h2 className="text-lg mb-1 font-display">WhatsApp para receber agendamentos</h2>
              <p className="text-stone-500 text-sm mb-4">
                Sempre que uma cliente marcar um horário, a confirmação abrirá pronta para enviar neste número.
              </p>
              <div className="flex flex-col sm:flex-row gap-3">
                <input type="tel" value={whatsInput} onChange={(e) => setWhatsInput(e.target.value)}
                  placeholder="Ex: 5571981609274 (DDI + DDD + número, só números)"
                  className="bg-white border border-pink-200 rounded-xl px-4 py-2.5 flex-1 focus:outline-none focus:ring-2 focus:ring-pink-500" />
                <button onClick={saveWhatsNumber}
                  className="bg-pink-500 hover:bg-pink-400 text-white font-semibold rounded-full px-5 py-2.5 transition-colors">
                  Salvar número
                </button>
              </div>
              {whatsSaved && (
                <p className="text-green-600 text-sm mt-3 flex items-center gap-1"><CheckIcon size={14}/> Número salvo com sucesso.</p>
              )}
              {!adminWhats && !whatsSaved && (
                <p className="text-pink-500 text-sm mt-3 flex items-center gap-1"><AlertIcon size={14}/> Nenhum número configurado ainda — os agendamentos não serão enviados automaticamente.</p>
              )}
            </section>
          )}

          {role === "admin" && (
            <section className="mb-8 bg-white border border-pink-100 rounded-2xl p-5 shadow-sm">
              <h2 className="text-lg mb-1 font-display">Meus serviços</h2>
              <p className="text-stone-500 text-sm mb-4">
                Adicione, edite ou remova os serviços que você oferece. Eles aparecem para as clientes na hora de marcar.
              </p>

              <div className="grid grid-cols-1 sm:grid-cols-[1fr_1fr_100px_110px] gap-3 mb-2">
                <input type="text" value={svcLabel} onChange={(e) => setSvcLabel(e.target.value)}
                  placeholder="Nome do serviço (ex: Sobrancelha)"
                  className="bg-white border border-pink-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-500" />
                <input type="text" value={svcDesc} onChange={(e) => setSvcDesc(e.target.value)}
                  placeholder="Descrição (opcional)"
                  className="bg-white border border-pink-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-500" />
                <input type="number" min="0" step="0.01" value={svcPrice} onChange={(e) => setSvcPrice(e.target.value)}
                  placeholder="Preço (R$)"
                  className="bg-white border border-pink-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-500" />
                <input type="number" min="1" value={svcMinutes} onChange={(e) => setSvcMinutes(e.target.value)}
                  placeholder="Minutos"
                  className="bg-white border border-pink-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-500" />
              </div>

              <div className="flex items-center gap-3 mb-4">
                <button onClick={handleSaveService}
                  className="bg-pink-500 hover:bg-pink-400 text-white font-semibold rounded-full px-5 py-2 transition-colors">
                  {editingSvcId ? "Salvar alterações" : "Adicionar serviço"}
                </button>
                {editingSvcId && (
                  <button onClick={resetServiceForm} className="text-stone-500 hover:text-pink-500 text-sm underline underline-offset-4">
                    Cancelar edição
                  </button>
                )}
              </div>

              {svcError && <p className="text-red-400 text-sm mb-4 flex items-center gap-1"><AlertIcon size={14}/>{svcError}</p>}

              {services.length === 0 ? (
                <div className="border border-dashed border-pink-200 rounded-2xl py-8 text-center text-stone-500">
                  Nenhum serviço cadastrado. Adicione o primeiro acima.
                </div>
              ) : (
                <ul className="flex flex-col gap-2">
                  {services.map((sv) => (
                    <li key={sv.id} className="flex items-center justify-between bg-pink-50 border border-pink-100 rounded-xl px-4 py-3 gap-3">
                      <div className="min-w-0">
                        <p className="font-semibold truncate">{sv.label} <span className="text-pink-500 font-normal text-xs">· {sv.minutes} min · {formatPrice(sv.price)}</span></p>
                        {sv.desc && <p className="text-stone-500 text-sm truncate">{sv.desc}</p>}
                      </div>
                      <div className="flex items-center gap-3 shrink-0">
                        <button onClick={() => handleEditService(sv)} className="text-stone-500 hover:text-pink-500 text-sm underline underline-offset-4">
                          Editar
                        </button>
                        <button onClick={() => handleDeleteService(sv.id)} className="text-stone-500 hover:text-red-400 transition-colors" aria-label="Remover serviço">
                          <TrashIcon size={18} />
                        </button>
                      </div>
                    </li>
                  ))}
                </ul>
              )}
            </section>
          )}

          {role === "admin" && (
            <section>
              <h2 className="text-2xl mb-4 font-display capitalize">Agenda — {formatDateLabel(date)}</h2>
              <div className="flex gap-3 mb-6">
                <input type="time" value={newTime} onChange={(e) => setNewTime(e.target.value)}
                  className="bg-white border border-pink-200 rounded-xl px-4 py-2.5 flex-1 focus:outline-none focus:ring-2 focus:ring-pink-500" style={{ colorScheme: "light" }} />
                <button onClick={handleAddSlot} disabled={!newTime}
                  className="bg-pink-500 hover:bg-pink-400 disabled:bg-pink-100 disabled:text-stone-500 text-white font-semibold rounded-full px-5 transition-colors">
                  Adicionar horário
                </button>
              </div>

              {loading ? <p className="text-stone-500">Carregando agenda...</p> :
                slots.length === 0 ? (
                  <div className="border border-dashed border-pink-200 rounded-2xl py-10 text-center text-stone-500">
                    Nenhum horário cadastrado para este dia.<br />Adicione o primeiro horário acima.
                  </div>
                ) : (
                  <ul className="flex flex-col gap-2">
                    {slots.map((s) => (
                      <li key={s.id} className="flex items-center justify-between bg-white border border-pink-100 rounded-xl px-4 py-3">
                        <div className="flex items-center gap-3">
                          <span className="text-lg text-pink-400 font-mono">{s.time}</span>
                          {s.status === "booked" ? (
                            <span className="text-sm text-stone-600">
                              Reservado — {s.clientName} <span className="text-stone-500">({servicesLabel(s.services || [], services)} · {formatPrice((s.services || []).reduce((sum, id) => sum + (services.find((sv) => sv.id === id)?.price || 0), 0))})</span>
                            </span>
                          ) : <span className="text-sm text-stone-500">Livre</span>}
                        </div>
                        <button onClick={() => handleRemoveSlot(s.id)} className="text-stone-500 hover:text-red-400 transition-colors" aria-label="Remover horário">
                          <TrashIcon size={18} />
                        </button>
                      </li>
                    ))}
                  </ul>
                )}
            </section>
          )}

          {role === "cliente" && !ticket && (
            <section>
              <h2 className="text-2xl mb-1 font-display">O que vamos fazer?</h2>
              <p className="text-stone-500 text-sm mb-5">Selecione um ou mais serviços — você pode combinar quantos quiser.</p>

              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-3">
                {services.map((sv) => (
                  <button key={sv.id} onClick={() => toggleService(sv.id)}
                    className={"rounded-2xl border px-3 py-4 text-left transition-all " + (selectedServices.includes(sv.id) ? "border-pink-500 bg-pink-500/10 shadow-sm" : "border-pink-100 bg-white hover:border-pink-300")}>
                    <div className="flex items-center justify-between">
                      <span className="text-base font-semibold text-stone-900">{sv.label}</span>
                      {selectedServices.includes(sv.id) && <CheckIcon size={16} className="text-pink-500" />}
                    </div>
                    <div className="text-xs text-stone-500 mt-1">{sv.desc}</div>
                    <div className="flex items-center justify-between mt-2">
                      <span className="text-xs text-pink-500">{sv.minutes} min</span>
                      <span className="text-xs font-semibold text-stone-700">{formatPrice(sv.price)}</span>
                    </div>
                  </button>
                ))}
              </div>

              {selectedServices.length > 0 && (
                <p className="text-sm text-pink-400 mb-6">
                  {servicesLabel(selectedServices, services)} · aproximadamente {totalMinutes} min · {formatPrice(totalPrice)}
                </p>
              )}

              <h2 className="text-2xl mb-1 font-display">Horários livres</h2>
              <p className="text-stone-500 text-sm mb-5 capitalize">{formatDateLabel(date)}</p>

              {loading ? <p className="text-stone-500">Carregando horários...</p> :
                freeSlots.length === 0 ? (
                  <div className="border border-dashed border-pink-200 rounded-2xl py-10 text-center text-stone-500">
                    Nenhum horário livre nesta data.<br />Tente escolher outro dia acima.
                  </div>
                ) : (
                  <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 mb-8">
                    {freeSlots.map((s) => (
                      <button key={s.id} onClick={() => setSelectedSlotId(s.id)}
                        className={"rounded-full border px-3 py-2.5 text-center font-mono transition-all " + (selectedSlotId === s.id ? "border-pink-500 bg-pink-500/10 text-pink-400 shadow-sm" : "border-pink-100 bg-white text-stone-700 hover:border-pink-300")}>
                        {s.time}
                      </button>
                    ))}
                  </div>
                )}

              {selectedServices.length > 0 && selectedSlotId && (
                <div className="bg-white border border-pink-100 rounded-2xl p-5 flex flex-col gap-3 shadow-sm">
                  <label className="text-sm text-stone-500">Seu nome</label>
                  <input type="text" value={clientName} onChange={(e) => setClientName(e.target.value)}
                    placeholder="Como podemos te chamar"
                    className="bg-pink-50 border border-pink-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-500" />
                  <button onClick={handleBook} disabled={!clientName.trim()}
                    className="bg-pink-500 hover:bg-pink-400 disabled:bg-pink-100 disabled:text-stone-500 text-white font-semibold rounded-full py-2.5 flex items-center justify-center gap-2 transition-colors">
                    <CheckIcon size={18} /> Confirmar horário
                  </button>
                </div>
              )}
            </section>
          )}

          {role === "cliente" && ticket && (
            <section className="flex flex-col items-center py-6">
              <div className="relative w-full max-w-sm bg-stone-50 text-stone-900 rounded-2xl overflow-hidden" style={{ transform: "rotate(-1.2deg)", boxShadow: "0 10px 30px rgba(224,105,156,0.25)" }}>
                <div className="w-3 h-full absolute left-0 top-0" style={{
                  backgroundImage: "linear-gradient(180deg, #F9D6E6 0%, #E0699C 35%, #C6A6EA 70%, #F9D6E6 100%)"
                }} />
                <div className="pl-8 pr-6 py-6">
                  <p className="text-xs tracking-[0.2em] text-stone-500 uppercase mb-1">Comprovante de horário</p>
                  <h3 className="text-3xl mb-4 font-display">Clínica Depilação</h3>
                  <div className="border-t border-dashed border-stone-300 pt-4">
                    <p className="text-xs text-stone-500 uppercase">Serviços</p>
                    <p className="font-semibold">{servicesLabel(ticket.services, services)}</p>
                    <p className="text-pink-500 font-semibold mt-1">
                      {formatPrice(ticket.services.reduce((sum, id) => sum + (services.find((s) => s.id === id)?.price || 0), 0))}
                    </p>
                  </div>
                  <div className="flex justify-between items-end mt-3">
                    <div>
                      <p className="text-xs text-stone-500 uppercase">Cliente</p>
                      <p className="font-semibold">{ticket.clientName}</p>
                    </div>
                    <div className="text-right">
                      <p className="text-xs text-stone-500 uppercase">Horário</p>
                      <p className="text-2xl font-mono">{ticket.time}</p>
                    </div>
                  </div>
                  <div className="mt-3">
                    <p className="text-xs text-stone-500 uppercase">Data</p>
                    <p className="font-semibold capitalize">{formatDateLabel(ticket.date)}</p>
                  </div>
                </div>
              </div>

              {adminWhats && (
                <a href={"https://wa.me/" + adminWhats + "?text=" + encodeURIComponent(
                    "Novo agendamento:\nCliente: " + ticket.clientName +
                    "\nData: " + formatDateLabel(ticket.date) +
                    "\nHorário: " + ticket.time +
                    "\nServiços: " + servicesLabel(ticket.services, services) +
                    "\nValor: " + formatPrice(ticket.services.reduce((sum, id) => sum + (services.find((s) => s.id === id)?.price || 0), 0))
                  )}
                  target="_blank" rel="noopener noreferrer"
                  className="mt-6 bg-green-600 hover:bg-green-500 text-white font-semibold rounded-full px-5 py-2.5 flex items-center gap-2 transition-colors">
                  <WhatsIcon size={18} /> Reenviar confirmação por WhatsApp
                </a>
              )}

              <button onClick={() => setTicket(null)} className="mt-4 text-pink-500 hover:text-pink-400 text-sm underline underline-offset-4">
                Marcar outro horário
              </button>
            </section>
          )}
        </main>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BarbeariaApp />);
</script>
</body>
</html>
